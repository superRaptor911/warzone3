# nginx site for warzone3.superraptor911.com — plain HTTP.
# certbot --nginx adds the 443 server block, the certificate lines and the
# 80 -> 443 redirect in place, so leave this file free of TLS and of any
# hand-rolled redirect or .well-known location for it to edit cleanly.
#
#   sudo cp deploy/warzone3.nginx.conf /etc/nginx/sites-available/warzone3
#   sudo ln -s /etc/nginx/sites-available/warzone3 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d warzone3.superraptor911.com
#
# HTTPS is not optional for phones: fullscreen, orientation lock and wake lock
# are secure-context APIs, requested from the mode-card tap. Over plain HTTP
# they all fail silently and mobile is left in portrait with browser chrome.

server {
    listen 80;
    listen [::]:80;
    server_name warzone3.superraptor911.com;

    access_log /var/log/nginx/warzone3.access.log;
    error_log  /var/log/nginx/warzone3.error.log;

    # ~1MB of JS ships uncompressed (pixi.min.mjs alone is 780K), and every
    # .ts source is served as text/javascript. gzip_proxied is required —
    # nginx does not compress upstream responses without it.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;

    # The game socket dials the origin root (client/js/net.ts), so the same
    # location serves static files and takes the ws upgrade.
    location / {
        # Must match PORT in ecosystem.config.cjs.
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;

        # Load-bearing: without these two the WebSocket upgrade is dropped and
        # the client sits on "Could not connect" while the page itself loads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 15Hz snapshots must not sit in a buffer, and the connection has to
        # outlive the 30s ws keepalive in server/index.ts.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
